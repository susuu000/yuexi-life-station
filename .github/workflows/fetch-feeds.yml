name: 抓取真实数据源

on:
  schedule:
    # UTC 时间，对应北京时间 07:10 / 12:10 / 19:10 / 22:10
    - cron: '10 23 * * *'
    - cron: '10 4 * * *'
    - cron: '10 11 * * *'
    - cron: '10 14 * * *'
  workflow_dispatch:        # 支持手动触发
  push:
    branches: [main]
    paths:
      - 'scripts/fetch-feeds.mjs'
      - '.github/workflows/fetch-feeds.yml'

permissions:
  contents: write

concurrency:
  group: fetch-feeds
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 抓取数据
        # 脚本内部对每个源都做了容错：单源失败会回填上一次的结果，
        # 因此这里不因个别源失败而中断整个工作流。
        run: node scripts/fetch-feeds.mjs
        continue-on-error: true

      - name: 校验 JSON 合法性
        run: |
          node -e "
            const fs = require('fs');
            const d = JSON.parse(fs.readFileSync('data/feeds.json', 'utf8'));
            const keys = Object.keys(d).filter(k => k !== 'updatedAt');
            let total = 0;
            for (const k of keys) {
              const v = d[k] && d[k].data;
              const n = Array.isArray(v) ? v.length : (v && typeof v === 'object' ? Object.keys(v).length : 0);
              total += n;
              console.log(k.padEnd(16), n, d[k] && d[k].stale ? '(旧数据)' : '');
            }
            if (total === 0) { console.error('全部板块为空，判定抓取失败'); process.exit(1); }
            console.log('校验通过，合计', total);
          "

      - name: 提交结果
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/feeds.json
          if git diff --staged --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore(data): 自动更新数据源 $(date -u -d '+8 hours' '+%Y-%m-%d %H:%M') CST"
            git push
          fi
