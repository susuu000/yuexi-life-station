<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#3A8A9E"/>
      <stop offset="100%" stop-color="#2E6F7E"/>
    </radialGradient>
    <linearGradient id="moon" x1="20%" y1="15%" x2="80%" y2="85%">
      <stop offset="0%" stop-color="#F5E6C8"/>
      <stop offset="40%" stop-color="#E8C547"/>
      <stop offset="100%" stop-color="#D4A847"/>
    </linearGradient>
    <linearGradient id="moonShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E6F7E" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1A5060" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="24" fill="url(#bg)"/>
  <!-- 月亮主体 -->
  <circle cx="48" cy="50" r="30" fill="url(#moon)"/>
  <!-- 月亮阴影（弯月效果） -->
  <circle cx="60" cy="44" r="27" fill="url(#moonShadow)"/>
  <!-- 滇红色装饰点（星星） -->
  <circle cx="22" cy="28" r="2.5" fill="#C04830" opacity="0.8"/>
  <circle cx="78" cy="72" r="2" fill="#D4A847" opacity="0.7"/>
  <circle cx="72" cy="22" r="1.5" fill="#C04830" opacity="0.5"/>
</svg>
