<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="月夕">
  <meta name="theme-color" content="#2E6F7E">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icon-180.png">
  <link rel="apple-touch-icon" sizes="167x167" href="assets/icon-167.png">
  <link rel="apple-touch-icon" sizes="152x152" href="assets/icon-152.png">
  <link rel="apple-touch-icon" sizes="120x120" href="assets/icon-120.png">
  <title>月夕生活台</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Supabase JS SDK（浏览器全局 supabase）。[cdn-final-v7]
       C-3 安全加固：锁定到精确版本 @2.112.0，并附带 sha384 SRI 校验 + 跨域匿名请求；
       若 CDN 不可达或 SRI 校验失败，直接降级为本地只读模式（不内置 vendor 副本，避免触发 GitHub Pages 构建限制）。 -->
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.0" integrity="sha384-De+l/Df7qym5QBDVocD3+gW1S7IjR3epf+6KbRDjB3FCCzM/LqVTwqckT6FhFar8" crossorigin="anonymous" onerror="console.warn('[月夕] Supabase SDK CDN 加载失败，已切换为本地只读模式')"></script>
  <style>
    .auth-tabs { display:flex; gap:8px; margin-bottom:16px; }
    .auth-tab { flex:1; padding:8px 0; border:none; background:transparent; color:var(--text-ink-muted); font-size:15px; cursor:pointer; border-bottom:2px solid transparent; }
    .auth-tab.active { color:var(--haze-blue); border-bottom-color:var(--haze-blue); font-weight:600; }
    .auth-form { display:flex; flex-direction:column; gap:12px; }
    /* font-size 必须 >= 16px：小于 16px 时 iOS Safari 聚焦输入框会自动放大页面 */
    .auth-input { width:100%; padding:11px 12px; border:1px solid var(--border-light); border-radius:10px; font-size:16px; background:var(--bg-card); color:var(--text-ink); box-sizing:border-box; }
    .auth-input:focus { outline:none; border-color:var(--haze-blue); }
    .auth-error { color:#C04830; font-size:13px; min-height:18px; }
    .auth-submit { width:100%; padding:12px; border:none; border-radius:10px; background:var(--haze-blue); color:#fff; font-size:15px; font-weight:600; cursor:pointer; }
    .auth-submit:disabled { opacity:.6; cursor:default; }
    .auth-hint { font-size:12px; color:var(--text-ink-muted); line-height:1.5; }
    .auth-skip { margin-top:4px; background:none; border:none; color:var(--text-ink-muted); font-size:13px; cursor:pointer; text-decoration:underline; }
    /* 顶部返回按钮（子板块页显示，首页/发现/我的隐藏） */
    .header-back-btn {
      display: none;
      align-items: center;
      gap: 4px;
      padding: 8px 14px 8px 10px;
      border-radius: var(--radius-sm);
      color: var(--haze-blue-dark);
      font-size: 15px;
      font-weight: 600;
      background: rgba(46,111,126,0.1);
      min-height: 44px;
      min-width: 44px;
      border: none;
      transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    @media (hover: hover) {
      .header-back-btn:hover { background: rgba(46,111,126,0.18); }
    }
    .header-back-btn:active { transform: scale(0.94); background: rgba(46,111,126,0.25); }
    .header-back-btn.visible { display: flex; }
  </style>
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="app-logo">
          <svg viewBox="0 0 100 100" class="logo-svg">
            <defs>
              <radialGradient id="bgG" cx="50%" cy="45%" r="65%">
                <stop offset="0%" stop-color="#3A8A9E"/>
                <stop offset="100%" stop-color="#2E6F7E"/>
              </radialGradient>
              <linearGradient id="mG" x1="20%" y1="15%" x2="80%" y2="85%">
                <stop offset="0%" stop-color="#F5E6C8"/>
                <stop offset="40%" stop-color="#E8C547"/>
                <stop offset="100%" stop-color="#D4A847"/>
              </linearGradient>
              <linearGradient id="mS" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#2E6F7E" stop-opacity="0.9"/>
                <stop offset="100%" stop-color="#1A5060" stop-opacity="0.95"/>
              </linearGradient>
            </defs>
            <rect width="100" height="100" rx="24" fill="url(#bgG)"/>
            <circle cx="48" cy="50" r="30" fill="url(#mG)"/>
            <circle cx="60" cy="44" r="27" fill="url(#mS)"/>
            <circle cx="22" cy="28" r="2.5" fill="#C04830" opacity="0.8"/>
            <circle cx="78" cy="72" r="2" fill="#D4A847" opacity="0.7"/>
          </svg>
        </div>
        <div class="app-title">
          <h1>月夕</h1>
          <span>生活台</span>
        </div>
      </div>

      <nav class="sidebar-nav" id="sidebarNav"></nav>

      <div class="sidebar-footer">
        <button class="sidebar-btn" id="accountBtn">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span>我的账户</span>
        </button>
        <button class="sidebar-btn" id="addSidebarBtn">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          <span>添加板块</span>
        </button>
      </div>
    </aside>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Main Content -->
    <main class="main-content">
      <header class="top-header">
        <div class="header-left">
          <button class="menu-toggle" id="menuToggle" aria-label="菜单">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
          </button>
          <button class="header-back-btn" id="headerBackBtn" aria-label="返回首页" onclick="App.goBack()">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
            <span>返回</span>
          </button>
          <div class="header-date-weather">
            <div class="current-date" id="currentDate"></div>
            <div class="current-weather" id="currentWeather"></div>
          </div>
        </div>
        <div class="header-right">
          <button class="sync-btn" id="searchBtn" title="全局搜索" onclick="App.openGlobalSearch()">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          </button>
          <div class="sync-status" id="syncStatus">
            <span class="sync-dot sync-dot-offline"></span>
            <span class="sync-text">未登录</span>
          </div>
          <button class="sync-btn" id="syncBtn" title="同步数据">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 11-3-6.7L21 8M21 3v5h-5"/></svg>
          </button>
        </div>
      </header>

      <div class="content-area" id="contentArea"></div>

      <!-- Bottom Navigation（由 App.renderBottomNav() 按用户配置动态渲染） -->
      <nav class="bottom-nav" id="bottomNav"></nav>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h3 id="modalTitle"></h3>
        <button class="modal-close" id="modalClose">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-esc-hint" id="modalEscHint">按 ESC 或点击空白处关闭</div>
    </div>
  </div>

  <!-- 登录 / 注册 弹窗 -->
  <div class="modal-overlay" id="authOverlay">
    <div class="modal" id="authModal" style="max-width:380px;">
      <div class="modal-header">
        <h3 id="authTitle">登录云端账户</h3>
        <button class="modal-close" id="authClose">&times;</button>
      </div>
      <div class="modal-body">
        <div class="auth-tabs">
          <button class="auth-tab active" data-tab="signin" id="tabSignin">登录</button>
          <button class="auth-tab" data-tab="signup" id="tabSignup">注册</button>
        </div>
        <div class="auth-form">
          <input type="email" id="authEmail" class="auth-input" placeholder="邮箱" autocomplete="email">
          <input type="password" id="authPassword" class="auth-input" placeholder="密码（至少 6 位）" autocomplete="current-password">
          <div class="auth-error" id="authError"></div>
          <button class="auth-submit" id="authSubmit">登录</button>
          <div class="auth-hint" id="authHint"></div>
          <button class="auth-skip" id="authSkip">稍后再说（仅本机使用）</button>
        </div>
      </div>
    </div>
  </div>

  <script defer src="js/config.js"></script>
  <script defer src="js/datasource.js"></script>
  <script defer src="js/storage.js"></script>
  <script defer src="js/sync.js"></script>
  <script defer src="js/sections.js"></script>
  <script defer src="js/app.js"></script>
  <script defer src="js/auth.js"></script>
  <!-- 内联猴子补丁已移除：返回按钮逻辑迁移至 App.switchTab / App.navigate 原生调用 App.syncHeaderBack()，见 js/app.js -->
</body>
</html>
